<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15191e"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Iron Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with four tabs over a single working column; rest timer docks to the bottom edge. Muscle groups are coded with competition plate colours. */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#f4f6f8; --ink:#15191e; --muted:#5b6570; --line:#d6dbe0;
  --accent:#2a5db0; --accent-ink:#ffffff; --good:#2f8a4c; --warn:#b7791f; --bad:#c3352f;
  --p-legs:#c8312f; --p-chest:#2a5db0; --p-back:#d9a21b; --p-shoulders:#2f8a4c; --p-arms:#f3f3f1; --p-core:#2b2f35; --p-cardio:#7a5cc2;
  --fig:#2b3138; --fig-bar:#6a737d; --fig-far:#8e98a3; --steel:#a9b1ba; --steel-dk:#6d7681; --pad:#36486a; --plate:#2c3238; --plate-rim:#5f6872; --chrome:#c7cdd3; --cable:#59626c; --heat:#e0533d; --heat0:#cfd5dc; --body-base:#eceef1; --body-line:#a9b1ba;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1e23; --sunk:#15181c; --ink:#e8ebee; --muted:#9aa4ae; --line:#2b3138;
  --accent:#5f92e8; --accent-ink:#0d1420; --good:#56b878; --warn:#e0a84a; --bad:#e8645d;
  --p-arms:#e9e9e6; --p-core:#5a616b; --fig:#d3d9df; --fig-bar:#7d8791; --fig-far:#7a848e; --steel:#4f5862; --steel-dk:#7c8691; --pad:#5672a6; --plate:#8b949e; --plate-rim:#c1c8cf; --chrome:#dfe4e8; --cable:#98a2ac; --heat:#ff7457; --heat0:#3a424b; --body-base:#24292f; --body-line:#11151a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e23; --sunk:#15181c; --ink:#e8ebee; --muted:#9aa4ae; --line:#2b3138;
  --accent:#5f92e8; --accent-ink:#0d1420; --good:#56b878; --warn:#e0a84a; --bad:#e8645d;
  --p-arms:#e9e9e6; --p-core:#5a616b; --fig:#d3d9df; --fig-bar:#7d8791; --fig-far:#7a848e; --steel:#4f5862; --steel-dk:#7c8691; --pad:#5672a6; --plate:#8b949e; --plate-rim:#c1c8cf; --chrome:#dfe4e8; --cable:#98a2ac; --heat:#ff7457; --heat0:#3a424b; --body-base:#24292f; --body-line:#11151a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.hspace{flex:1}
.unit-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.unit-toggle button{background:none;border:0;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.unit-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
nav.tabs{max-width:860px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:32px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:19px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px;display:inline-grid;place-items:center;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.plate{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none;vertical-align:-1px;position:relative}
.plate::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pr-badge{display:inline-block;background:var(--warn);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;font-family:var(--f-body)}

/* Train */
.session-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.elapsed{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-card-head{display:flex;gap:12px;align-items:center;padding:12px 12px 10px}
.thumb{width:64px;height:48px;border-radius:6px;background:var(--sunk);flex:none;overflow:hidden;display:grid;place-items:center;cursor:pointer;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:100%;height:100%}
.ex-card-title{flex:1;min-width:0}
.ex-card-title b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1.1}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 12px;border-top:1px solid var(--line)}
.sets td{padding:7px 12px;border-top:1px solid var(--line)}
.sets td.n{width:36px;color:var(--muted)}
.sets td.x{width:40px;text-align:right}
.logger{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-height:40px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.logger .field{width:96px}
.stepper{display:flex}
.stepper input{border-radius:0;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.stepper button{border:1px solid var(--line);background:var(--surface);width:30px;cursor:pointer;font-weight:700;color:var(--muted)}
.stepper button:first-child{border-radius:7px 0 0 7px;border-right:0}
.stepper button:last-child{border-radius:0 7px 7px 0;border-left:0}
.logger .field.w{width:150px}
.plate-math{font-size:12px;color:var(--muted);padding:0 12px 10px;background:var(--sunk);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.plate-math .pl{display:inline-block;padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{font-weight:600}

/* Exercises */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px;flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ex-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.ex-tile:hover{border-color:var(--muted)}
.ex-tile .pic{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;overflow:hidden;max-width:100%}
.ex-tile .pic img{width:100%;height:100%;object-fit:cover}
.ex-tile .pic svg{width:100%;height:100%}
.ex-tile .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.ex-tile .meta b{font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.ex-tile .best{font-size:13px;color:var(--muted)}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.hero-pic{aspect-ratio:16/10;background:var(--sunk);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;max-width:100%}
.hero-pic img{width:100%;height:100%;object-fit:cover}
.hero-pic svg{width:100%;height:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.pick-list{display:flex;flex-direction:column;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick-list label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick-list label:first-child{border-top:0}
.field .pick-list label{font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.field .pick-list input{width:auto;min-height:0;flex:none;accent-color:var(--accent)}
.pick-list label>span:not(.ord){flex:1;min-width:0}
.pick-list .ord{margin-left:auto;font-family:var(--f-display);font-weight:700;color:var(--accent);min-width:18px;text-align:right}
.spark{width:100%;height:90px;display:block}

/* PRs */
.pr-table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pr-table{width:100%;border-collapse:collapse;min-width:520px}
.pr-table th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.pr-table td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.pr-table tr:first-child td{border-top:0}
.pr-big{font-family:var(--f-display);font-size:22px;font-weight:600}
.manual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.record{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;position:relative}
.record .val{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.record .del{position:absolute;top:6px;right:6px}

/* Rest timer */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px}
#rest .rwrap{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#rest .rtime{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;min-width:96px}
#rest .rlabel{flex:1;min-width:120px}
#rest .rlabel small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
#rest .rlabel span{font-weight:600}
#rest .rbar{position:absolute;left:0;top:0;height:4px;background:var(--accent);transition:width .25s linear}
#rest button{background:transparent;border:1px solid color-mix(in srgb,var(--surface) 35%,transparent);color:var(--surface);border-radius:8px;min-height:38px;padding:4px 12px;font-weight:600;cursor:pointer}
#rest.done{background:var(--good)}
#rest.done .rbar{background:var(--surface)}
.presets{display:flex;gap:6px;flex-wrap:wrap}

/* Session extras */
.card-tools{display:flex;gap:0;flex:none}
.card-tools .icon-btn:disabled{opacity:.3;cursor:default;background:none}
.suggest{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:0 12px 10px}
.warm{padding:0 12px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.warm .btn{padding-left:0}
.warm-steps,.plate-math{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.warm-steps .pl{display:inline-block;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.warm-steps .pl.work{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hist-btn{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0}
.hist-btn:hover b{text-decoration:underline}
.pr-hit{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

/* Heat map */
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.heat-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.heat-map{display:flex;flex-direction:column;gap:10px;min-width:0}
.bodymap{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.bodymap .mz{cursor:pointer;transition:opacity .15s}
.bodymap .mz:hover{opacity:.8}
.heat-legend{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.heat-legend span{display:inline-flex;gap:4px;align-items:center}
.heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.heat-detail{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.heat-list{display:flex;flex-direction:column;min-width:0}
.heat-row{display:grid;grid-template-columns:1fr 36px 84px;gap:8px;align-items:center;padding:6px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:14px;border-radius:0}
.heat-row:first-child{border-top:0}
.heat-row:hover,.heat-row.on{background:var(--sunk)}
.heat-row b{text-align:right}
.hr-name{display:flex;gap:8px;align-items:center;min-width:0}
.hr-name i{width:12px;height:12px;border-radius:3px;flex:none}
.hr-st{font-size:11px;font-weight:700;text-align:center;padding:2px 6px;border-radius:999px;letter-spacing:.02em}
.hr-st.none{color:var(--muted);background:var(--sunk)}
.hr-st.low{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.hr-st.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.hr-st.high{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.mw{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:10px}
.mw-text{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.mw-key{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mpick{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.mchip[data-st="p"]{background:var(--heat);border-color:var(--heat);color:#fff}
.mchip[data-st="s"]{background:color-mix(in srgb,var(--heat) 22%,var(--surface));border-color:color-mix(in srgb,var(--heat) 50%,var(--line));color:var(--ink)}
@media (max-width:640px){.heat-grid{grid-template-columns:1fr}.mw{grid-template-columns:120px 1fr}}
/* Drop sets and rest */
.sets tr.drop td{background:color-mix(in srgb,var(--warn) 7%,transparent);border-top-style:dashed}
.sets tr.drop td.n{color:var(--warn);font-weight:700}
.drop-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:4px;padding:0 4px}
.drop-hint{color:var(--warn)}
.log-btns{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.btn.drop-go{background:var(--warn);border-color:var(--warn);color:#fff}
.rest-chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;margin-left:6px}
.rest-chip:hover{border-color:var(--accent);color:var(--accent)}
.rest-chip.custom{border-style:solid;border-color:var(--accent);color:var(--accent)}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.rest-grid .rp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rp-scope{border:1px solid var(--line);border-radius:8px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:6px}
.rp-scope label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

/* Coach */
.coach-msg{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,#6b4fc8 9%,var(--surface));border:1px solid color-mix(in srgb,#6b4fc8 40%,var(--line));border-radius:var(--r);padding:12px 12px 12px 16px}
.coach-msg>div{flex:1;min-width:0}.coach-msg p{margin:4px 0 0}
.coach-msg .eyebrow,.coach-eyebrow{color:#7c62d6}
.coach-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#6b4fc8;border-radius:4px;padding:1px 7px;margin-bottom:4px}

/* Cardio */
.cardio-logger{flex-direction:column;align-items:stretch}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;width:100%}
.cf-grid .field{width:auto}
.cf-grid input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.cardio-logger .log-btns{justify-content:flex-end;width:100%}
.cpace{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--accent);margin-right:auto}
.cardio-kpis{grid-template-columns:repeat(4,1fr)}
.cardio-kpis .v{font-size:24px!important}
.ex-card.cardio .sets td{font-size:13px}
@media (max-width:640px){.cardio-kpis{grid-template-columns:1fr 1fr}}

/* Supersets */
.superset{border:2px solid var(--accent);border-radius:calc(var(--r) + 4px);padding:10px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.ss-head{display:flex;gap:10px;align-items:center;padding:0 2px}
.ss-badge{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.ss-head b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:17px}
.ss-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:3px;letter-spacing:0}
.link-row{display:flex;justify-content:center;margin:-12px 0}
.superset .link-row{margin:-4px 0}
.link-btn{border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;min-height:30px}
.link-btn:hover{border-color:var(--accent);color:var(--accent)}
.link-btn.on{border-style:solid;border-color:var(--accent);color:var(--accent)}
.ex-card.flash{box-shadow:0 0 0 3px var(--accent)}
.wo-order{display:flex;flex-direction:column;gap:4px}
.wo-order .link-btn{align-self:center}
.wo-row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:var(--surface)}
.wo-row.in-ss{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wo-n{font-family:var(--f-display);font-weight:700;color:var(--muted);min-width:22px}
.wo-row.in-ss .wo-n{color:var(--accent)}
.wo-row .icon-btn:disabled{opacity:.3}
.wo-chips{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center}
.wo-chip{text-transform:none;font-size:14px;color:var(--ink)}
.wo-chip b{color:var(--muted)}
.wo-ss{display:inline-flex;gap:10px;flex-wrap:wrap;border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px}
.wo-ss .wo-chip b{color:var(--accent)}
/* History */
.delta{font-size:11px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.same{color:var(--muted)}
.sets td.was{font-size:13px}
.next-hint{font-size:13px;color:var(--muted);padding:8px 12px 0;border-top:1px solid var(--line)}
.next-hint b{color:var(--ink)}
.hist{padding:4px 12px 10px;border-top:1px solid var(--line)}
.hist .btn{padding-left:0}
.hist-wrap{overflow-x:auto}
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px 4px 0}
.hist-table td{padding:6px 8px 6px 0;border-top:1px solid var(--line);vertical-align:top}
.compare-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
dialog.wide{width:min(860px,calc(100vw - 24px))}
.prog-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.prog-table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
.prog-table th,.prog-table td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.prog-table thead th{border-top:0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prog-table tbody th,.prog-table tfoot th{font-weight:600;position:sticky;left:0;background:var(--surface)}
.prog-table tfoot{background:var(--sunk)}
.prog-table tfoot th{background:var(--sunk)}
@media (max-width:520px){.sets .e1{display:none}}

/* Week strip */
.week{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.wdays{display:flex;gap:8px}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.wday i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:block}
.wday.on i{background:var(--accent);border-color:var(--accent)}
.wday.today span{color:var(--ink)}
.wday.today i{border-color:var(--ink)}
.wday.today.on i{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.wstats{display:flex;gap:20px;flex-wrap:wrap}
.wstats div{display:flex;flex-direction:column}
.wstats b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.wstats span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Progress */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpis .stat{background:var(--surface);border:1px solid var(--line)}
.kpis .stat .v{font-size:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.hm-wrap{overflow-x:auto}
.hm{display:flex;gap:6px;width:max-content}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10px;line-height:14px;color:var(--muted);margin-top:17px}
.hm-months{display:grid;grid-template-columns:repeat(16,14px);gap:3px;height:14px;font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.hm-grid{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.hm-cell{border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.hm-cell.future{background:transparent;border-color:transparent}
.hm-cell.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface));border-color:transparent}
.hm-cell.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));border-color:transparent}
.hm-cell.l3{background:color-mix(in srgb,var(--accent) 78%,var(--surface));border-color:transparent}
.hm-cell.l4{background:var(--accent);border-color:transparent}
.bars{width:100%;height:auto;display:block}
.bal{display:flex;flex-direction:column;gap:8px}
.bal-row{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bal-name{display:flex;gap:6px;align-items:center;font-weight:600}
.bal-row b{text-align:right}
.bal-track{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bal-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 18%,transparent)}
.bal-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:4px;background:var(--muted)}
.bal-fill.ok{background:var(--good)}
.bal-fill.low{background:var(--warn)}
.bal-fill.high{background:var(--accent)}
.feed{padding:9px 0;border-top:1px solid var(--line);gap:12px;flex-wrap:nowrap}
.feed:first-child{border-top:0}
@media (max-width:640px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:30;font-weight:500;max-width:calc(100vw - 32px)}
.note{font-size:13px;color:var(--muted)}

@media (max-width:520px){
  h1{font-size:28px}
  .form-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
  #rest .rtime{font-size:36px;min-width:80px}
  .logger .field{width:84px}
  .logger .field.w{width:132px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Exercise illustrations ----------
   Side-view scenes on a 160x120 canvas, floor at y=110. Near limbs are dark, far limbs lighter,
   so both arms (and both dumbbells) read. Equipment is drawn from simple parts. */
const C={fig:"var(--fig)",far:"var(--fig-far)",pad:"var(--pad)",st:"var(--steel)",sd:"var(--steel-dk)",pl:"var(--plate)",rim:"var(--plate-rim)",ch:"var(--chrome)",cb:"var(--cable)",fl:"var(--line)"};
const pt=p=>p[0].toFixed(1)+","+p[1].toFixed(1);
const ln=(a,b,c,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const pl=(ps,c,w)=>`<polyline points="${ps.map(pt).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const ci=(p,r,f)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${f}"/>`;
const rc=(x,y,w,h,f,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r==null?1.5:r}" fill="${f}"/>`;
const FL=ln([4,110],[156,110],C.fl,2);
const PAD=(a,b,w)=>ln(a,b,C.pad,w||7);
const STL=(ps,w)=>pl(ps,C.st,w||3.5);
const STD=(ps,w)=>pl(ps,C.sd,w||3.5);
const ROL=(p,r)=>ci(p,r||5,C.pad)+ci(p,1.6,C.ch);
const CAB=ps=>`<polyline points="${ps.map(pt).join(" ")}" fill="none" stroke="${C.cb}" stroke-width="1.4"/>`;
const PUL=p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="none" stroke="${C.sd}" stroke-width="2"/>`+ci(p,1.2,C.sd);
const BACK=s=>`<g opacity=".55">${s}</g>`;
// Weight plate seen end-on (barbells and plate horns)
const PLT=(p,r)=>{r=r||13;return ci(p,r,C.pl)+`<circle cx="${p[0]}" cy="${p[1]}" r="${(r*.7).toFixed(1)}" fill="none" stroke="${C.rim}" stroke-width="1"/>`+ci(p,Math.max(1.6,r*.2),C.ch)};
// Dumbbell in profile; a = rotation in degrees
const DB=(p,a,s)=>{s=s||1;return `<g transform="translate(${p[0]} ${p[1]}) rotate(${a||0}) scale(${s})">${rc(-6,-1.2,12,2.4,C.ch,1)}${rc(-10,-4.8,4.5,9.6,C.pl,1)}${rc(5.5,-4.8,4.5,9.6,C.pl,1)}</g>`};
// Dumbbell seen end-on (front views)
const DBE=(p,r)=>{r=r||5;const h=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;h.push([p[0]+r*Math.cos(a),p[1]+r*Math.sin(a)])}return `<polygon points="${h.map(pt).join(" ")}" fill="${C.pl}"/>`+ci(p,1.6,C.ch)};
const KB=p=>ci([p[0],p[1]+4],6.5,C.pl)+`<path d="M${p[0]-4},${p[1]-1} Q${p[0]},${p[1]-10} ${p[0]+4},${p[1]-1}" fill="none" stroke="${C.pl}" stroke-width="2.6"/>`;
const HANDLE=(p,v)=>v?ln([p[0],p[1]-6],[p[0],p[1]+6],C.sd,3):ln([p[0]-6,p[1]],[p[0]+6,p[1]],C.sd,3);
// Weight stack tower; x = left edge
const STACK=(x,top,w)=>{w=w||18;let s=rc(x,top,w,110-top,C.st,2)+`<rect x="${x+2.5}" y="${top+4}" width="${w-5}" height="${106-top-4}" fill="var(--sunk)" opacity=".7"/>`;
  for(let i=0;i<9;i++)s+=rc(x+3.5,104-i*4.3-3.3,w-7,3.3,C.pl,.6);
  s+=ln([x+w/2,top+4],[x+w/2,104-9*4.3],C.ch,1.2)+rc(x-1.5,top-3,w+3,5,C.sd,1.5)+ln([x-4,109],[x+w+4,109],C.sd,3);return s};
// Cable tower; pulley on the side facing the person (side = 1 right, -1 left) at height py
const TOWER=(x,py,side)=>{let s=STACK(x-8,6,16);s+=rc(side>0?x+8:x-14,py-7,6,14,C.sd,1.5);return s+PUL([x+side*13,py])};
const tp=(x,py,side)=>[x+side*13,py];
// Bench: pivot (px,py) on the top surface, seat to the right, back pad to the left raised by ang degrees
function BENCH(px,py,seat,back,ang,noLegs){
  const r=ang*Math.PI/180, be=[px-back*Math.cos(r),py-back*Math.sin(r)];
  let s="";
  if(!noLegs){
    const rl=[px-back*.8*Math.cos(r),py-back*.8*Math.sin(r)+4];
    s+=STD([[px,py+4],[px,108]])+STD([rl,[rl[0]-3,108]])+STD([[px+seat-5,py+4],[px+seat-2,108]])+STD([[rl[0]-8,108.5],[px+seat+4,108.5]],3);
  }
  return s+PAD([px+seat,py],[px,py])+PAD([px,py],be);
}
const SEAT=(x1,x2,y)=>STD([[(x1+x2)/2,y+3],[(x1+x2)/2,108]])+STD([[(x1+x2)/2-12,108.5],[(x1+x2)/2+12,108.5]],3)+PAD([x1,y],[x2,y]);
const RACK=(x,top,hook,dir)=>{dir=dir||1;return STL([[x,108],[x,top]],4)+STD([[x,hook],[x+5*dir,hook],[x+5*dir,hook-4]],2.5)+STD([[x-8,108.5],[x+8,108.5]],3)};
const BOX=(x,y,w,h)=>rc(x,y,w,h,C.sd,2)+`<rect x="${x+3}" y="${y+3}" width="${w-6}" height="${h-6}" rx="1" fill="none" stroke="${C.st}" stroke-width="1"/>`;
const ARROW=(p,up)=>pl([[p[0]-3,p[1]+(up?3:-3)],[p[0],p[1]],[p[0]+3,p[1]+(up?3:-3)]],C.cb,1.6)+ln(p,[p[0],p[1]+(up?9:-9)],C.cb,1.6);

// Side-view person. Points: hd head, sh shoulder, hp hip, ne/nh near elbow/hand, nk/na near knee/ankle.
// Far limbs default to the near ones shifted by `off`; set fe/fh/fk/fa to pose them differently.
function P(o){
  const d=o.dir||1, off=o.off||[2.5,-2.5], add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
  const fsh=add(o.sh,off), fhp=add(o.hp,off);
  const fe=o.fe||(o.ne&&add(o.ne,off)), fh=o.fh||(o.nh&&add(o.nh,off));
  const fk=o.fk||add(o.nk,off), fa=o.fa||add(o.na,off);
  const toe=(a,t)=>t||[a[0]+6*d,a[1]+1.5];
  let s="";
  if(o.farLeg!==false)s+=pl([fhp,fk,fa],C.far,7)+ln(fa,toe(fa,o.ft),C.far,5);
  if(o.farArm!==false&&fe)s+=pl([fsh,fe,fh],C.far,6)+ci(fh,3.1,C.far);
  s+=o.fItem||"";
  s+=ln(o.sh,o.hp,C.fig,12)+ln(o.sh,o.hd,C.fig,5)+ci(o.hd,7,C.fig);
  s+=pl([o.hp,o.nk,o.na],C.fig,7.5)+ln(o.na,toe(o.na,o.nt),C.fig,5);
  s+=o.mid||"";
  if(o.ne)s+=pl([o.sh,o.ne,o.nh],C.fig,6.5)+ci(o.nh,3.3,C.fig);
  return s+(o.nItem||"");
}
// Front-view person (both sides equally visible). la/ra = [elbow,hand], ll/rl = [knee,ankle].
function PF(o){
  const cx=o.cx||80, sy=o.sy||42, py=o.py||70, hy=o.hy||30;
  const ls=[cx-10,sy], rs=[cx+10,sy], lh=[cx-6,py], rh=[cx+6,py];
  let s=o.pre||"";
  s+=pl([lh,...o.ll],C.fig,7.5)+ln(o.ll[1],[o.ll[1][0]-5,o.ll[1][1]+1.5],C.fig,5);
  s+=pl([rh,...o.rl],C.fig,7.5)+ln(o.rl[1],[o.rl[1][0]+5,o.rl[1][1]+1.5],C.fig,5);
  s+=o.mid||"";
  s+=`<path d="M${cx-11},${sy-2} L${cx+11},${sy-2} L${cx+7.5},${py+2} L${cx-7.5},${py+2} Z" fill="${C.fig}" stroke="${C.fig}" stroke-width="4" stroke-linejoin="round"/>`;
  s+=ln([cx,sy],[cx,hy],C.fig,5)+ci([cx,hy],7.5,C.fig);
  s+=pl([ls,...o.la],C.fig,6.5)+ci(o.la[1],3.3,C.fig)+pl([rs,...o.ra],C.fig,6.5)+ci(o.ra[1],3.3,C.fig);
  return s+(o.post||"");
}

  upright:{bench:()=>BENCH(82,86,22,46,82),body:{hd:[81,41],sh:[82,53],hp:[86,81],nk:[106,84],na:[108,107]},up:[[84,38],[86,24]]},

function benchPress(kind,impl){
  const b=BP[kind], [ne,nh]=b.up, o={...b.body,ne,nh};
  let pre=b.bench();
  if(impl==="bb"){pre=BACK(RACK(kind==="incline"?46:kind==="upright"?66:40,kind==="incline"?18:30,kind==="incline"?28:44,1))+pre;o.nItem=PLT(nh,13)}
  if(impl==="smith"){pre=BACK(STL([[30,108],[30,8]],4)+STL([[130,108],[130,8]],4)+ln([30,8],[130,8],C.st,4))+ln([nh[0],6],[nh[0],108],C.ch,2.5)+pre;o.nItem=PLT(nh,11)}
  if(impl==="db"){o.fItem=DB([nh[0]+2.5,nh[1]-2.5],0);o.nItem=DB(nh,0)}
  return FL+pre+P(o);
}

async function connect(){

    if(!db||!user)return;

    if(!id)return;
    const base = db.doc("data/users/"+id+"/profile");

    mode = "db";

// Walks history oldest to newest; a set is a PR when it beats every earlier set of that exercise.
function prEvents(){

function cardioRecordsTable(EX){

/* ---------- Supersets ----------
   Entries (in a session) share a key `g` when they form a superset. Only adjacent entries count. */
function ssRuns(entries){
  const runs=[], n=entries.length, EX=exercises();
  for(let i=0;i<n;){
    const g=entries[i].g;
    if(g){let j=i;while(j+1<n&&entries[j+1].g===g)j++;
      if(j>i)runs.push({start:i,end:j,g,L:String.fromCharCode(65+runs.length),rest:Math.max(...entries.slice(i,j+1).map(x=>restOf(x,EX[x.exId])))});
      i=j+1;}
    else i++;
  }
  return runs;
}
function normalizeGroups(entries){
  const runs=ssRuns(entries), keep=new Set();
  runs.forEach((r,k)=>{for(let i=r.start;i<=r.end;i++){entries[i].g="g"+k+"_"+r.start;keep.add(i)}});
  entries.forEach((x,i)=>{if(!keep.has(i))delete x.g});
  return entries;
}
// Workout definitions store a parallel `groups` array; turn it into group keys for a list of ids.
function workoutGroups(w){return (w.exerciseIds||[]).map((x,i)=>(w.groups||[])[i]||null)}

/* ---------- History comparisons ---------- */
function setScore(st,metric){if(st.cardio||metric==="cardio")return cardioScore(st);const w=conv(st.w,st.u),r=+st.r||0;if(metric==="time")return r;const v=e1rm(w,r);return v>0?v:w+r/1000}
function bestSet(sets,metric){let b=null,bs=-Infinity;for(const st of sets||[]){const sc=setScore(st,metric);if(sc>bs){bs=sc;b=st}}return b}
function fmtSet(st,metric){if(!st)return "—";if(st.cardio||metric==="cardio")return fmtCardio(st,false);return metric==="time"?`${esc(st.r)} s`:`${fmtW(conv(st.w,st.u))}×${esc(st.r)}`}
// Compare a set with an earlier one: weight first, then reps.
function cmpSet(cur,prev,metric){
  if(!cur||!prev)return null;
  if(cur.cardio&&prev.cardio)return cmpCardio(cur,prev);
  if(metric==="time"){const d=(+cur.r)-(+prev.r);return d>0?{c:"up",t:`+${d}s`}:d<0?{c:"down",t:`${d}s`}:{c:"same",t:"="}}
  const dw=Math.round((conv(cur.w,cur.u)-conv(prev.w,prev.u))*10)/10;
  if(Math.abs(dw)>=0.1)return dw>0?{c:"up",t:`+${fmtW(dw)}`}:{c:"down",t:`${fmtW(dw)}`};
  const dr=(+cur.r)-(+prev.r);
  return dr>0?{c:"up",t:`+${dr} rep${dr>1?"s":""}`}:dr<0?{c:"down",t:`${dr} rep${dr<-1?"s":""}`}:{c:"same",t:"="};
}
// A set list as text; drop sets attach to the set before them: "145×8 ↳100×6, 145×8"
function fmtSets(sets,metric){let o="";for(const st of sets||[])o+=st.drop?` ↳${fmtSet(st,metric)}`:(o?", ":"")+fmtSet(st,metric);return o}
const mainSets=sets=>(sets||[]).filter(x=>!x.drop);
// Cardio has no rest timer unless you set one
const restOf=(en,e)=>en&&en.rest!=null?en.rest:(isCardio(e)?(e.cardioRest??0):(e?.rest??90));
const DELTA=(d)=>d?`<span class="delta ${d.c}">${d.c==="up"?"▲":d.c==="down"?"▼":""} ${esc(d.t)}</span>`:"";
// Which saved workout a session belongs to (older sessions are matched by name)
function workoutIdOf(s){
  if(s.workoutId&&S.workouts[s.workoutId])return s.workoutId;
  const m=Object.entries(S.workouts).find(([,w])=>w.name&&w.name===s.name);return m?m[0]:null;
}
function sessionsForWorkout(wid){return sessionsSorted().filter(s=>s.done&&workoutIdOf(s)===wid).reverse()}
// Earlier sessions that include this exercise, newest first; sessions of the same workout come first.
function priorFor(exId,s){
  const wid=workoutIdOf(s);
  const list=sessionsSorted().filter(x=>x.done&&x.id!==s.id&&(x.entries||[]).some(e=>e.exId===exId&&(e.sets||[]).length))
    .map(x=>({sid:x.id,date:x.startedAt,name:x.name,same:!!wid&&workoutIdOf(x)===wid,sets:(x.entries||[]).filter(e=>e.exId===exId).flatMap(e=>e.sets||[])}));
  const ref=list.find(x=>x.same)||list[0]||null;
  return {list,ref};
}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dayKey(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function sessionSetCount(s){return (s.entries||[]).reduce((n,e)=>n+(e.sets||[]).length,0)}
function sessionVolume(s,EX){return (s.entries||[]).reduce((n,e)=>n+(EX[e.exId]?.metric==="time"?0:(e.sets||[]).reduce((m,st)=>m+Math.max(0,conv(st.w,st.u))*(+st.r||0),0)),0)}
function weekStreak(){
  const weeks=new Set(sessionsSorted().filter(s=>s.done).map(s=>weekStart(s.startedAt).getTime()));
  let w=weekStart(new Date()), n=0;
  if(!weeks.has(w.getTime()))w.setDate(w.getDate()-7); // this week still counts as open
  while(weeks.has(w.getTime())){n++;w.setDate(w.getDate()-7)}
  return n;
}
function roundTo(w){const s=UI.unit==="lb"?5:2.5;return Math.round(w/s)*s}
// Double progression: hit the rep target on every working set, then add weight.
function suggestion(e,lastSets){
  if(!lastSets.length||e.metric==="time"||e.assist)return null;
  const ws=lastSets.map(st=>conv(st.w,st.u)), top=Math.max(...ws);
  const work=lastSets.filter((st,i)=>ws[i]>=top-0.01);
  const goal=+work[0].r||0;
  const hitAll=work.every(st=>(+st.r||0)>=goal);
  if(top<=0)return {w:0,r:goal+1,why:`You did ${goal} reps last time. Go for one more.`};
  const lb=UI.unit==="lb";
  const big=e.equip==="Barbell"&&(e.muscle==="Legs"||e.muscle==="Back");
  const inc=big?(lb?10:5):(lb?5:2.5);
  if(hitAll)return {w:roundTo(top+inc)||top+inc,r:goal,why:`You hit ${goal} reps on ${work.length>1?"every working set":"your top set"} last time. Add ${inc} ${UI.unit}.`};
  return {w:fmtW(top),r:goal,why:`Last time you missed ${goal} reps on some sets. Stay at this weight until every set hits ${goal}.`};
}
function warmups(target){
  const lb=UI.unit==="lb", barW=lb?45:20;
  if(!(target>barW*1.4))return [];
  const steps=[[0,10],[.4,5],[.6,3],[.8,2]], out=[], seen=new Set();
  for(const [p,r] of steps){const w=p===0?barW:Math.max(barW,roundTo(target*p));if(w>=target||seen.has(w))continue;seen.add(w);out.push({w,r})}
  return out;
}

/* ---------- Plate math ---------- */
function plateMath(total){
  const lb = UI.unit==="lb";
  const barW = lb?45:20, plates = lb?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  let side=(total-barW)/2;
  if(!(total>0))return "";
  if(side<0)return `<span>Below the empty bar (${barW} ${UI.unit})</span>`;
  if(side===0)return `<span>Empty bar (${barW} ${UI.unit})</span>`;
  const used=[];
  for(const p of plates){while(side>=p-1e-9){used.push(p);side-=p}}
  const rest=side>0.01?` <span>+ ${fmtW(side)} left over</span>`:"";
  return `<span>Per side on a ${barW} ${UI.unit} bar:</span>${used.map(p=>`<span class="pl num">${p}</span>`).join("")}${rest}`;
}

function weekStrip(EX){
  const ws=weekStart(new Date()), today=dayKey(new Date());
  const done=sessionsSorted().filter(s=>s.done&&new Date(s.startedAt)>=ws);
  const byDay={};for(const s of done){const k=dayKey(s.startedAt);byDay[k]=(byDay[k]||0)+sessionSetCount(s)}
  const vol=done.reduce((n,s)=>n+sessionVolume(s,EX),0);
  const days=["M","T","W","T","F","S","S"].map((l,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);const k=dayKey(d);
    return `<div class="wday${byDay[k]?" on":""}${k===today?" today":""}" title="${esc(fmtDate(d.toISOString()))}${byDay[k]?": "+byDay[k]+" sets":""}"><span>${l}</span><i></i></div>`}).join("");
  const streak=weekStreak();
  return `<div class="panel week"><div class="wdays">${days}</div>
    <div class="wstats num"><div><b>${done.length}</b><span>sessions this week</span></div><div><b>${Math.round(vol).toLocaleString()}</b><span>${UI.unit} lifted</span></div><div><b>${streak}</b><span>week streak</span></div></div></div>`;
}

function exerciseBlock(s,en,i,EX,tag){
  if(isCardio(EX[en.exId]))return cardioBlock(s,en,i,EX,tag);
  const e=EX[en.exId]||{name:"Removed exercise",pattern:"press",muscle:"Core",metric:"reps",rest:90};

    <div class="ex-card-head">

function muscleLoad(days){
  const EX=exercises(), since=Date.now()-days*864e5, load={}, from={};
  MUSC.forEach(([m])=>{load[m]=0;from[m]={}});
  for(const s of sessionsSorted()){
    if(new Date(s.startedAt).getTime()<since)continue;
    for(const en of s.entries||[]){
      const e=EX[en.exId];if(!e)continue;
      const n=(en.sets||[]).length;if(!n)continue;
      const mw=musclesOf(e);
      for(const m of mw.p)if(m in load){load[m]+=n;from[m][e.name]=(from[m][e.name]||0)+n}
      for(const m of mw.s)if(m in load){load[m]+=n/2;from[m][e.name]=(from[m][e.name]||0)+n/2}
    }
  }
  return {load,from};
}

function musclesWorked(e){

function renderProgress(){

  const byDay={};for(const s of done){const k=dayKey(s.startedAt);byDay[k]=(byDay[k]||0)+sessionSetCount(s)}
  const maxDay=Math.max(1,...Object.values(byDay));
  const today=new Date();today.setHours(23,59,59,999);
  let cells="", months="";
  for(let w=0;w<WEEKS;w++){
    const col=new Date(start);col.setDate(col.getDate()+w*7);
    months+=`<span>${col.getDate()<=7?esc(col.toLocaleDateString(undefined,{month:"short"})):""}</span>`;
    for(let d=0;d<7;d++){
      const day=new Date(col);day.setDate(day.getDate()+d);

  ${heatPanel()}
  <section class="panel stack">

function volBars(vw,aria){
  const W=520,H=170,pl=44,pr=6,pt=10,pb=22, mx=Math.max(1,...vw.map(x=>x.v));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(mx)));for(const m of [1,2,2.5,5,10])if(m*p>=mx)return m*p;return 10*p})();
  const bw=(W-pl-pr)/vw.length, y=v=>pt+(H-pt-pb)*(1-v/nice);
  const ticks=[0,nice/2,nice];
  const fmt=v=>v>=1000?(Math.round(v/100)/10)+"k":Math.round(v);
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria||"Weekly volume for the last 10 weeks"}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(t)}</text>`).join("")}
    ${vw.map((x,i)=>{const last=i===vw.length-1, h=(H-pt-pb)-(y(x.v)-pt);return `<rect x="${pl+i*bw+bw*.18}" y="${y(x.v)}" width="${bw*.64}" height="${Math.max(0,h)}" rx="2" fill="var(--accent)" opacity="${last?1:.55}"><title>Week of ${esc(fmtDate(x.a.toISOString(),{month:"short",day:"numeric"}))}: ${Math.round(x.v).toLocaleString()}</title></rect>
      ${i%3===0||last?`<text x="${pl+i*bw+bw/2}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${last?"This wk":esc(x.a.toLocaleDateString(undefined,{month:"short",day:"numeric"}))}</text>`:""}`}).join("")}
  </svg>`;
}

// Exercises of a saved workout, with superset runs grouped: [{L, items:[{id,e,tag}]}]
function workoutBlocks(w,EX){
  const ids=w.exerciseIds||[], groups=workoutGroups(w), out=[];let letter=0;
  for(let i=0;i<ids.length;){
    let j=i;if(groups[i])while(j+1<ids.length&&groups[j+1]===groups[i])j++;
    const items=ids.slice(i,j+1).map(id=>({id,e:EX[id]})).filter(x=>x.e);
    const L=j>i?String.fromCharCode(65+letter++):null;
    items.forEach((x,k)=>x.tag=L?L+(k+1):null);
    if(items.length)out.push({L,items});i=j+1;
  }
  return out;
}
function workoutSummary(w,EX){return workoutBlocks(w,EX).map(b=>b.items.map(x=>esc(x.e.name)).join(" + ")).join(" · ")}
function workoutChips(w,EX){
  let n=0;
  return workoutBlocks(w,EX).map(b=>{
    const chips=b.items.map(x=>`<span class="chip wo-chip"><b class="num">${b.L?x.tag:++n}</b><i class="plate" style="background:var(${PLATE[x.e.muscle]||"--p-core"})"></i>${esc(x.e.name)}</span>`).join("");
    return b.L?`<span class="wo-ss" title="Superset ${b.L}">${chips}</span>`:chips;
  }).join("");
}
function workoutProgress(wid){
  const w=S.workouts[wid];if(!w)return;
  const EX=exercises(), all=sessionsForWorkout(wid), ss=all.slice(-6);
  if(!ss.length){toast("Finish this workout once to start tracking progress.");return}
  const ids=[...(w.exerciseIds||[])];
  for(const s of ss)for(const en of s.entries||[])if(!ids.includes(en.exId)&&(en.sets||[]).length)ids.push(en.exId);
  const rows=ids.filter(id=>EX[id]).map(id=>{
    const e=EX[id];
    const cells=ss.map(s=>bestSet((s.entries||[]).filter(x=>x.exId===id).flatMap(x=>x.sets||[]),e.metric));
    let prev=null;
    const tds=cells.map(c=>{const d=c&&prev?cmpSet(c,prev,e.metric):null;if(c)prev=c;return `<td class="num">${c?`<b>${fmtSet(c,e.metric)}</b>${d&&d.c!=="same"?`<div>${DELTA(d)}</div>`:""}`:`<span class="muted">—</span>`}</td>`}).join("");
    const first=cells.find(Boolean), last=[...cells].reverse().find(Boolean);
    const tot=first&&last&&first!==last?cmpSet(last,first,e.metric):null;
    return `<tr><th scope="row"><i class="plate" style="background:var(${PLATE[e.muscle]||"--p-core"})"></i> ${esc(e.name)}</th>${tds}<td class="num">${tot?DELTA(tot):`<span class="muted">—</span>`}</td></tr>`;
  }).join("");
  const vols=ss.map(s=>sessionVolume(s,EX)), durs=ss.map(s=>s.finishedAt?fmtDur(new Date(s.finishedAt)-new Date(s.startedAt)):"—");
  const vChange=vols.length>1&&vols[0]>0?Math.round((vols[vols.length-1]/vols[0]-1)*100):null;
  openDlg(`
    <div class="dlg-head"><div><div class="eyebrow">Workout progress</div><h2>${esc(w.name)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">×</button></div>
    <div class="dlg-body">
      <p class="note" style="margin:0">Best set of each exercise in your last ${ss.length} session${ss.length>1?"s":""}${all.length>ss.length?` (of ${all.length})`:""}. Arrows compare with the session before; the last column compares first and last.</p>

        <tbody>${rows}</tbody>
        <tfoot>
          <tr><th scope="row">Volume (${UI.unit})</th>${vols.map(v=>`<td class="num">${Math.round(v).toLocaleString()}</td>`).join("")}<td class="num">${vChange==null?"—":DELTA({c:vChange>0?"up":vChange<0?"down":"same",t:(vChange>0?"+":"")+vChange+"%"})}</td></tr>
          <tr><th scope="row">Duration</th>${durs.map(d=>`<td class="num">${d}</td>`).join("")}<td></td></tr>
        </tfoot>
      </table></div>
    </div>
    <div class="dlg-foot"><button class="btn" data-act="close">Close</button>${activeSession()?"":`<button class="btn primary" data-act="start-workout" data-id="${esc(wid)}">Start ${esc(w.name)}</button>`}</div>`);
  dlg.classList.add("wide");dlg.addEventListener("close",()=>dlg.classList.remove("wide"),{once:true});
}

function sparkline(pts,unit,label){
  const W=500,H=90,pl=4,pr=40,pt=10,pb=18;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),span=(mx-mn)||1;
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/span);
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const area=`${x(0)},${H-pb} ${line} ${x(pts.length-1)},${H-pb}`;
  const last=pts[pts.length-1];
  return `<div class="stack" style="gap:4px"><div class="eyebrow">${esc(label)}</div>
  <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
    <line x1="${pl}" y1="${y(mx)}" x2="${W-pr}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${pl}" y1="${y(mn)}" x2="${W-pr}" y2="${y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="4" fill="var(--accent)"/>
    <text x="${W-pr+6}" y="${y(mx)+4}" font-size="11" fill="var(--muted)">${mx<20?Math.round(mx*10)/10:Math.round(mx)}</text>
    ${mx!==mn?`<text x="${W-pr+6}" y="${y(mn)+4}" font-size="11" fill="var(--muted)">${mx<20?Math.round(mn*10)/10:Math.round(mn)}</text>`:""}
    <text x="${pl}" y="${H-3}" font-size="11" fill="var(--muted)">${esc(fmtDate(pts[0].d,{month:"short",day:"numeric"}))}</text>
    <text x="${W-pr}" y="${H-3}" font-size="11" fill="var(--muted)" text-anchor="end">${esc(fmtDate(last.d,{month:"short",day:"numeric"}))}</text>
  </svg><div class="note">Values in ${esc(unit)}</div></div>`;
}

async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast("That file isn't a valid backup.");return}
  if(!data||data.app!=="iron-log"||!data.data){toast("That file isn't an Iron Log backup.");return}
  const n=COLS.reduce((a,c)=>a+Object.keys(data.data[c]||{}).length,0);
  if(!(await confirmBox("Restore backup?",`This adds ${n} items from the backup. Items that already exist here with the same id are replaced.`,"Restore")))return;
  for(const c of COLS)for(const [k,v] of Object.entries(data.data[c]||{}))if(v&&typeof v==="object")put(c,k,v,true);
  if(mode!=="db")saveLocal();
  render();toast("Backup restored");
}

function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      const preview=c.toDataURL("image/jpeg",q);
      c.toBlob(b=>b?res({blob:b,preview}):rej(new Error("encode")),"image/jpeg",q);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("load"))};
    img.src=url;
  });
}

/* ---------- Rest timer ---------- */
const R={end:0,total:0,name:"",t:null,wake:null,alerted:false};
let actx=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;
  try{[0,0.28,0.56].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=i===2?1320:880;
    g.gain.setValueAtTime(0.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(0.18,actx.currentTime+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d+0.22);
    o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+0.25)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
async function wake(on){
  try{if(on&&!R.wake&&navigator.wakeLock){R.wake=await navigator.wakeLock.request("screen");R.wake.addEventListener("release",()=>{R.wake=null})}
      else if(!on&&R.wake){await R.wake.release();R.wake=null}}catch(e){R.wake=null}
}
function startRest(sec,name){
  ensureAudio();
  R.total=sec;R.end=Date.now()+sec*1000;R.name=name||"Rest";R.alerted=false;
  const el=document.getElementById("rest");el.hidden=false;el.classList.remove("done");
  document.getElementById("rname").textContent=R.name;
  document.getElementById("rsub").textContent="Resting";
  document.getElementById("rstop").textContent="Skip";
  clearInterval(R.t);R.t=setInterval(tickRest,250);tickRest();wake(true);
}
function tickRest(){
  const left=(R.end-Date.now())/1000;
  const el=document.getElementById("rest");
  document.getElementById("rtime").textContent=left>0?fmtSec(Math.ceil(left)):"0:00";
  document.getElementById("rbar").style.width=(R.total?Math.max(0,Math.min(1,1-left/R.total))*100:100)+"%";
  if(left<=0&&!R.alerted){R.alerted=true;el.classList.add("done");document.getElementById("rsub").textContent="Rest over";document.getElementById("rname").textContent="Next set: "+R.name;document.getElementById("rstop").textContent="Dismiss";beep();
    clearInterval(R.t);wake(false);}
}
function stopRest(){clearInterval(R.t);document.getElementById("rest").hidden=true;wake(false)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&R.end&&!document.getElementById("rest").hidden){tickRest();if(!R.alerted&&!R.wake)wake(true)}});

   Syncs this log to the gym's Iron Log Coach and receives programs and messages from the trainer. */
const COACH={
  get(){return ls.get("ironlog.coach",null)},
  set(v){ls.set("ironlog.coach",v)},
  available(){return !window.claude&&/^https?:$/.test(location.protocol)},

let coachBusy=false;
async function coachSync(silent){
  const c=COACH.get();if(!COACH.on()||coachBusy)return;
  coachBusy=true;
  try{
    const exs={};for(const [k,v] of Object.entries(S.exercises||{})){const {imgData,...rest}=v||{};exs[k]=rest}
    const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:c.clientId,code:c.code,name:c.name,profile:c.profile,data:{sessions:S.sessions,exercises:exs,unit:UI.unit}})});
    const j=await r.json().catch(()=>({}));
    if(r.status===410||j.removed){
      // The coach removed this connection: keep the log, drop coach workouts and the link
      for(const [wid,w] of Object.entries(S.workouts))if(w.fromCoach)del("workouts",wid);
      COACH.set(null);updateCoachBtn();render();
      toast(j.error||"Your coach removed this connection.");return;
    }
    if(!r.ok)throw new Error(j.error||`Sync failed (${r.status})`);
    // Replace programs from the coach with the latest set
    const keep=new Set();
    for(const a of j.assigned||[]){
      const id="coach_"+String(a.id).replace(/[^a-zA-Z0-9_-]/g,"");keep.add(id);
      const exIds=(a.exerciseIds||[]).filter(x=>exercises()[x]);
      put("workouts",id,{name:a.name,exerciseIds:exIds,groups:(a.exerciseIds||[]).map((x,k)=>exercises()[x]?(a.groups||[])[k]||null:undefined).filter(x=>x!==undefined),plan:a.plan||{},focus:a.focus||"",fromCoach:true,coachMessage:a.coachMessage||"",createdAt:a.assignedAt||new Date().toISOString()},true);
    }
    for(const [id,w] of Object.entries(S.workouts))if(w.fromCoach&&!keep.has(id))del("workouts",id);
    COACH.set({...c,lastSync:new Date().toISOString(),inbox:j.inbox||[],error:null});
    if(mode!=="db")saveLocal();
    render();
    if(!silent)toast(`Synced with your coach${(j.assigned||[]).length?` · ${(j.assigned||[]).length} workouts from your coach`:""}`);
  }catch(e){COACH.set({...c,error:String(e.message||e)});if(!silent)toast(String(e.message||e))}
  finally{coachBusy=false}
}

      const key=a.g||b.g||uid("g"), old=b.g;d.entries.forEach(x=>{if(old&&x.g===old)x.g=key});a.g=key;b.g=key;normalizeGroups(d.entries)});break;}
    case "unlink": {const i=+t.dataset.i;updateActive(d=>{const key=d.entries[i].g, nk=uid("g");
      for(let k=i+1;k<d.entries.length&&d.entries[k].g===key;k++)d.entries[k].g=nk;normalizeGroups(d.entries)});break;}
    case "start-empty": newSession("Session",[]);break;

      updateActive(d=>{d.entries=d.entries||[];d.entries.push({exId:v,sets:[]})});break;}
    case "del-entry": {
      const i=+t.dataset.i, s=activeSession(), en=s.entries[i];
      if((en.sets||[]).length&&!(await confirmBox("Remove exercise?","Its logged sets in this session will be removed too.","Remove")))break;
      updateActive(d=>{d.entries.splice(i,1);normalizeGroups(d.entries)});break;}
    case "step": {
      const ex=t.dataset.ex,k=t.dataset.k,dd=+t.dataset.d;
      const d=UI.drafts[ex]||(UI.drafts[ex]={w:"",r:""});
      const lo=(k==="w"&&exercises()[ex]?.assist)?-1000:0;
      d[k]=Math.max(lo,Math.round(((+d[k]||0)+dd)*100)/100);
      const inp=document.querySelector(`input[data-draft="${CSS.escape(ex)}"][data-k="${k}"]`);if(inp)inp.value=d[k];
      updatePlateMath(ex);break;}
    case "log-set": {
      ensureAudio();
      const i=+t.dataset.i, s=activeSession(), en=s.entries[i], e=exercises()[en.exId]||{rest:90,name:"Exercise"};
      const d=UI.drafts[en.exId]||{};
      let newSet, isDrop=false;
      if(isCardio(e)){
        const res=cardioSetFrom(e,d);if(res.err){toast(res.err);break}
        newSet=res.st;d.hr="";d.cal="";
      }else{
        const w=parseFloat(d.w)||0, r=parseInt(d.r,10)||0;
        if(r<=0){toast(e.metric==="time"?"Enter the hold time in seconds.":"Enter how many reps you did.");break}
        isDrop=!!UI.dropMode[en.exId];
        if(isDrop&&!(en.sets||[]).length){UI.dropMode[en.exId]=false;render();break}
        newSet={w,r,u:UI.unit,at:new Date().toISOString(),...(isDrop?{drop:true}:{})};
      }
      updateActive(dd=>{dd.entries[i].sets=dd.entries[i].sets||[];dd.entries[i].sets.push(newSet)});
      if(newSet.cardio)toast(`Logged ${e.name}: ${fmtCardio(newSet,true).replace(/&amp;/g,"&")}`);
      if(isDrop){
        // back to the working weight for the next full set
        UI.dropMode[en.exId]=false;
        const ret=UI.dropReturn&&UI.dropReturn[en.exId];if(ret!=null)UI.drafts[en.exId]={...UI.drafts[en.exId],w:ret};
        render();
      }
      const rest=restOf(en,e);
      const run=ssRuns(s.entries).find(x=>i>=x.start&&i<=x.end);
      if(run&&i<run.end){
        // Superset: go straight to the next exercise, rest after the round
        stopRest();
        const nx=exercises()[s.entries[i+1].exId];
        toast(`Superset ${run.L}: now ${nx?nx.name:"next exercise"}`);
        requestAnimationFrame(()=>{const c=document.querySelector(`.ex-card[data-idx="${i+1}"]`);if(c){c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1200)}});
      }else if(run){
        const back=s.entries[run.start];
        if(run.rest>0)startRest(run.rest,`Superset ${run.L}`);
        toast(`Round done. Rest, then back to ${exercises()[back.exId]?.name||"the first exercise"}`);
        requestAnimationFrame(()=>{const c=document.querySelector(`.ex-card[data-idx="${run.start}"]`);if(c)c.scrollIntoView({behavior:"smooth",block:"start"})});
      }else if(rest>0)startRest(rest,e.name);
      break;}
    case "drop-mode": {
      const i=+t.dataset.i, s=activeSession(), en=s.entries[i];if(!en)break;
      const lastMain=mainSets(en.sets).slice(-1)[0];if(!lastMain)break;
      const d=UI.drafts[en.exId]||(UI.drafts[en.exId]={});
      UI.dropReturn=UI.dropReturn||{};UI.dropReturn[en.exId]=d.w;
      const lw=conv(lastMain.w,lastMain.u);
      d.w=lw>0?Math.max(0,roundTo(lw*0.75)):d.w;
      UI.dropMode[en.exId]=true;stopRest();render();
      const inp=document.querySelector(`.ex-card[data-idx="${i}"] input[data-k="w"]`);if(inp){inp.focus();inp.select&&inp.select()}
      break;}
    case "drop-cancel": {
      const ex=t.dataset.ex;UI.dropMode[ex]=false;
      const ret=UI.dropReturn&&UI.dropReturn[ex];if(ret!=null)UI.drafts[ex]={...UI.drafts[ex],w:ret};
      render();break;}
    case "rest-pick": restPickerFor(+t.dataset.i);break;
    case "del-set": {const i=+t.dataset.i,j=+t.dataset.j;updateActive(d=>{d.entries[i].sets.splice(j,1)});break}
    case "finish-session": {
      const s=activeSession();
      const n=(s.entries||[]).reduce((a,e)=>a+(e.sets||[]).length,0);
      if(!n){if(await confirmBox("No sets logged","Nothing was logged in this session. Discard it?","Discard"))del("sessions",s.id);break}
      const notes=document.getElementById("sessNotes");
      updateActive(d=>{d.done=true;d.finishedAt=new Date().toISOString();d.entries=normalizeGroups(d.entries.filter(e=>(e.sets||[]).length));if(notes)d.notes=notes.value.trim()});
      stopRest();UI.drafts={};UI.warm={};UI.notesDraft=undefined;sessionDialog(s.id,true);coachSync(true);break;}
    case "open-session": sessionDialog(id,false);break;
    case "repeat-session": {
      closeDlg();
      if(activeSession()){toast("Finish or discard the session in progress first.");UI.tab="train";render();break}
      const p=S.sessions[id];if(!p)break;
      const EXs=exercises(), seen=new Set();
      const items=(p.entries||[]).filter(e=>EXs[e.exId]&&!seen.has(e.exId)&&seen.add(e.exId)).map(e=>({exId:e.exId,g:e.g}));
      const wid=workoutIdOf({...p,id});
      newSession(p.name,items,wid?{workoutId:wid}:{});break;}
    case "save-as-workout": {
      const p=S.sessions[id];if(!p)break;
      const name=(!p.name||p.name==="Session")?"Workout from "+fmtDate(p.startedAt,{month:"short",day:"numeric"}):p.name;
      const EXs=exercises(), seen=new Set();
      const ents=(p.entries||[]).filter(e=>EXs[e.exId]&&!seen.has(e.exId)&&seen.add(e.exId));
      const existing=Object.entries(S.workouts).find(([,w])=>w.name===name);
      const wid=existing?existing[0]:uid("w_");
      put("workouts",wid,{name,exerciseIds:ents.map(e=>e.exId),groups:ents.map(e=>e.g||null),createdAt:existing?existing[1].createdAt:new Date().toISOString()});
      put("sessions",id,{...p,workoutId:wid});
      toast(existing?`Updated “${name}”`:`Saved “${name}” to Workouts`);break;}
    case "move-entry": {const i=+t.dataset.i,dd=+t.dataset.d;updateActive(d=>{const j=i+dd;if(j<0||j>=d.entries.length)return;[d.entries[i],d.entries[j]]=[d.entries[j],d.entries[i]];normalizeGroups(d.entries)});break}
    case "toggle-warm": UI.warm[t.dataset.ex]=!UI.warm[t.dataset.ex];render();break;
    case "del-bw": del("body",id);break;
    case "backup": saveFile(`iron-log-backup-${dayKey(new Date())}.json`,JSON.stringify({app:"iron-log",version:1,exportedAt:new Date().toISOString(),data:S},null,1));break;
    case "export-csv": saveFile(`iron-log-sets-${dayKey(new Date())}.csv`,csvExport());break;
    case "discard-session": {
      const s=activeSession();
      if(await confirmBox("Discard this session?","Every set logged in this session will be deleted.","Discard")){del("sessions",s.id);stopRest();UI.drafts={};UI.notesDraft=undefined}
      break;}
    case "del-session": if(await confirmBox("Delete session?","This session and its sets will be removed from your history and PRs.","Delete")){del("sessions",id);toast("Session deleted")}break;
    case "new-pr": prForm();break;
    case "del-pr": if(await confirmBox("Delete record?",`${S.prs[id]?.label||"This record"} will be removed.`,"Delete"))del("prs",id);break;
    case "rest-open": restPicker();break;
    case "coach-open": coachDialog();break;
    case "coach-sync": closeDlg();coachSync(false);break;
    case "coach-off": if(await confirmBox("Disconnect from your coach?","Your log stays on this device. Workouts from your coach are removed.","Disconnect")){for(const [wid,w] of Object.entries(S.workouts))if(w.fromCoach)del("workouts",wid);COACH.set(null);updateCoachBtn();render()}break;
    case "coach-seen": {const c=COACH.get();if(c){COACH.set({...c,seen:[...(c.seen||[]),id].slice(-50)});render()}break;}
    case "rest-start": closeDlg();startRest(+t.dataset.s,t.dataset.name);break;
    case "rest-add": R.end+= (+t.dataset.s)*1000; if(R.alerted){R.alerted=false;document.getElementById("rest").classList.remove("done");document.getElementById("rsub").textContent="Resting";document.getElementById("rname").textContent=R.name;document.getElementById("rstop").textContent="Skip";clearInterval(R.t);R.t=setInterval(tickRest,250);if(R.end<Date.now())R.end=Date.now()+15000;R.total=Math.max(R.total,(R.end-Date.now())/1000)} tickRest();break;
    case "rest-stop": stopRest();break;
  }
});
function updatePlateMath(ex){
  const pm=document.querySelector(`[data-pm="${CSS.escape(ex)}"]`);
  const d=UI.drafts[ex];
  if(UI.warm[ex]){render();return}
  if(pm)pm.innerHTML=plateMath(+d.w);
  else if(+d.w>0&&exercises()[ex]?.equip==="Barbell")render();
}
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="exEquip"){UI.equip=t.value;render();return}
  if(t.id==="sessNotes"){const v=t.value.trim();const s=activeSession();if(s&&(s.notes||"")!==v)updateActive(d=>{d.notes=v});UI.notesDraft=undefined}
  if(t.id==="restoreFile"&&t.files[0]){importBackup(t.files[0]);t.value=""}
});
document.addEventListener("submit",ev=>{
  if(ev.target.id!=="bwForm")return;
  ev.preventDefault();
  const v=parseFloat(document.getElementById("bwVal").value), date=document.getElementById("bwDate").value||dayKey(new Date());
  if(!(v>0)){toast("Enter your bodyweight.");return}
  put("body",date,{date,w:v,u:UI.unit});toast("Weigh-in logged");
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="sessNotes"){UI.notesDraft=t.value;return}
  if(t.id==="exSearch"){UI.q=t.value;render();return}
  if(t.dataset&&t.dataset.draft){const ex=t.dataset.draft;(UI.drafts[ex]||(UI.drafts[ex]={}))[t.dataset.k]=t.value;
    const cp=document.querySelector(`.cpace[data-cp="${CSS.escape(ex)}"]`);
    if(cp){const e=exercises()[ex],cfg=cardioCfg(e),du=cfg.dist==="m"?"m":"road",dr=UI.drafts[ex],dv=parseFloat(dr.d);
      cp.textContent=paceText({r:parseClock(dr.t),d:dv>0?dv*UNIT_M[distUnit(du)]:0,du,pk:cfg.pace})}if(t.dataset.k==="w")updatePlateMath(ex)}
});

render();
connect();
updateCoachBtn();
if(COACH.on())setTimeout(()=>coachSync(true),600);
// Invite links: /?join=GYMCODE&name=Client%20Name
(()=>{let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  const join=(q.get("join")||"").trim();if(!join||!COACH.available())return;
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  if(COACH.on()){toast("You’re already connected to your coach");return}
  setTimeout(()=>coachDialog({code:join.toUpperCase().slice(0,20),name:(q.get("name")||"").trim().slice(0,60)}),300);
})();
(async()=>{try{if(window.claude&&claude.use){downloads=await claude.use("downloads");if(UI.tab==="progress")render()}}catch(e){downloads=null}})();
})();
</script>

</body></html>
